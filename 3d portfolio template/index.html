    <script>
      function showFooter() {

      function hideFooter() {

      }

      function slide(element) {
        let bioslider = document.getElementById('bioslider');
        let contactslider = document.getElementById('contactslider');
        
        if (element == 'bioslider' && !contactslider.classList.contains('close')) {
          bioslider.classList.toggle('close');
          contactslider.classList.add('close');
        } else if (element == 'contactslider' && !bioslider.classList.contains('close')) {
          contactslider.classList.toggle('close');
          bioslider.classList.add('close');
        } else {
          document.getElementById(element).classList.toggle('close');
        }
      }
    </script>
